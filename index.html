<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:#050816;
    color:white;
    position:relative;
}

/* Animated Background */
body::before{
    content:"";
    position:absolute;
    width:150%;
    height:150%;
    background:
    radial-gradient(circle at 20% 20%, rgba(0,255,255,0.15), transparent 30%),
    radial-gradient(circle at 80% 30%, rgba(0,132,255,0.15), transparent 30%),
    radial-gradient(circle at 50% 80%, rgba(170,0,255,0.15), transparent 30%);
    animation:moveBg 12s linear infinite alternate;
}

@keyframes moveBg{
    from{transform:translate(-5%,-5%) rotate(0deg);}
    to{transform:translate(5%,5%) rotate(15deg);}
}

.container{
    position:relative;
    z-index:2;
    text-align:center;
    padding:50px;
    width:min(90%,800px);
}

.logo{
    font-size:70px;
    margin-bottom:20px;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

h1{
    font-size:3rem;
    font-weight:700;
    margin-bottom:15px;
    background:linear-gradient(90deg,#00e5ff,#4d8dff,#b84dff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

p{
    color:#b8c2d9;
    font-size:1.1rem;
    line-height:1.8;
    margin-bottom:35px;
}

.loader{
    width:280px;
    height:8px;
    margin:auto;
    background:rgba(255,255,255,0.08);
    border-radius:50px;
    overflow:hidden;
}

.loader span{
    display:block;
    height:100%;
    width:40%;
    background:linear-gradient(90deg,#00e5ff,#4d8dff,#b84dff);
    border-radius:50px;
    animation:loading 2s infinite;
}

@keyframes loading{
    0%{
        transform:translateX(-100%);
    }
    100%{
        transform:translateX(700%);
    }
}

.status{
    margin-top:20px;
    color:#8fa3c7;
    letter-spacing:3px;
    font-size:14px;
    text-transform:uppercase;
}

.glow{
    position:absolute;
    inset:0;
    border-radius:20px;
    background:rgba(255,255,255,0.03);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:
    0 0 30px rgba(0,229,255,.15),
    0 0 60px rgba(77,141,255,.1);
    z-index:-1;
}
</style>
</head>

<body>

<div class="container">
    <div class="glow"></div>

    <div class="logo">🚀</div>

    <h1>Website Under Construction</h1>

    <p>
        Sabin Poudel
Developer • Creator • Problem Solver
A new digital experience is on the way.
I’m currently building a portfolio that reflects my work, skills, projects, and passion for technology.
✨ Coming Soon 🚀
    </p>

    <div class="loader">
        <span></span>
    </div>

    <div class="status">
        Launching Soon
    </div>
</div>

</body>
</html>
